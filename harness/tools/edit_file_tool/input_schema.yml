properties:
  file_path:
    type: string
    description: Absolute path of the file to edit. The file must already exist.
  old_string:
    type: string
    description: The exact substring to find and replace. Whitespace, indentation and line endings must match the file verbatim. Must be unique in the file unless `replace_all` is true.
    minLength: 1
  new_string:
    type: string
    description: The string that replaces `old_string`. May be empty (deletes the snippet).
  replace_all:
    type: boolean
    description: When true, replace every occurrence of `old_string`. When false (default), the tool refuses to edit unless `old_string` is unique in the file.
    default: false
required:
  - file_path
  - old_string
  - new_string
