properties:
  pattern:
    type: string
    description: The glob pattern to match against filenames (e.g. "**/*.py", "src/**/*.{ts,tsx}", "*.md").
  path:
    type: string
    description: Absolute path to the directory to search in. Defaults to the current working directory.
  head_limit:
    type: integer
    description: Maximum number of paths to return. Defaults to 100.
    minimum: 0
required:
  - pattern
