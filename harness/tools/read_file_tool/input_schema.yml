properties:
  file_path:
    type: string
    description: Absolute path to the file to read.
  offset:
    type: integer
    description: 1-indexed raw source line to start paging from. Defaults to 1. An offset past EOF reads from the beginning with the default limit.
    minimum: 1
  limit:
    type: integer
    description: Maximum raw source lines to read. Defaults to 2000, capped at 2000.
    minimum: 1
    maximum: 2000
  raw_markdown:
    type: boolean
    description: Read raw .md source with source line numbers when true. Defaults to false, expanding dynamic Markdown tags. Ignored for other file types.
required:
  - file_path
